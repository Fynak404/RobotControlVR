name: Build Quest 3 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Export Godot APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Godot and Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/
          rm Godot_v4.3-stable_export_templates.tpz Godot_v4.3-stable_linux.x86_64.zip

      - name: Generate Android Build Files
        run: |
          # Vraag Godot om de android build template bestanden te exporteren vanuit de templates naar de projectmap
          godot --headless --export-pack "Android" /dev/null || true
          # Maak de mappenstructuur aan die de export-preset verwacht
          mkdir -p android/build/libs/debug android/build/libs/release
          touch android/build/build.gradle android/build/settings.gradle

      - name: Create build folder
        run: mkdir -p build/android

      - name: Generate APK
        run: |
          godot --verbose --headless --export-release "Android" build/android/robot-control.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quest3-apk
          path: build/android/robot-control.apk