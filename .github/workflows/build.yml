name: Build Quest 3 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Export Godot APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Godot and Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/4.3.stable/
          rm Godot_v4.3-stable_export_templates.tpz Godot_v4.3-stable_linux.x86_64.zip

      - name: Create Valid Gradle Android Build Structure
        run: |
          # Maak de exacte mappenstructuur aan die Godot eist voor Gradle builds
          mkdir -p android/build/libs/debug android/build/libs/release
          cat << 'EOF' > android/build/build.gradle
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          android {
              namespace 'com.robot.control'
              compileSdk 34
          }
          EOF
          cat << 'EOF' > android/build/settings.gradle
          rootProject.name = "RobotControlVR"
          EOF

      - name: Inject Correct Export Preset (Gradle=true)
        run: |
          cat << 'EOF' > export_presets.cfg
          [runnable_presets]
          Android="Android"

          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path=""
          patches=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false
          script_export_mode=2

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=true
          architectures/arm64-v8a=true
          package/unique_name="com.robot.control"
          package/name="RobotControlVR"
          package/signed=true
          xr_features/xr_mode=1
          screen/immersive_mode=true
          EOF

      - name: Create build folder
        run: mkdir -p build/android

      - name: Generate APK
        run: |
          godot --verbose --headless --export-release "Android" build/android/robot-control.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quest3-apk
          path: build/android/robot-control.apk